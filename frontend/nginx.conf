server {
    listen 80;
    root /usr/share/nginx/html;

    # Same origin as the UI, so the API needs no CORS (docs/ARCHITECTURE.md §9).
    location /api/ {
        proxy_pass http://api:8030/;
        proxy_set_header Host $host;
        proxy_read_timeout 120s;   # a real Claude triage can take ~15 s
        client_max_body_size 1m;
    }

    # Client-side routes (/incidents, /stats) fall back to the app.
    location / {
        try_files $uri /index.html;
    }
}

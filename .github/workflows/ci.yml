name: CI

# Free by design (NFR-10): no secrets, no Claude calls (demo mode), AWS emulated by Moto.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      db:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: triage
          POSTGRES_PASSWORD: triage
          POSTGRES_DB: triage
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U triage" --health-interval 3s --health-retries 20
    env:
      DATABASE_URL: postgresql://triage:triage@localhost:5432/triage
      TEST_DATABASE_URL: postgresql://triage:triage@localhost:5432/triage_test
      LLM_MODE: demo
      FASTEMBED_CACHE_PATH: ${{ github.workspace }}/.fastembed
      PGPASSWORD: triage
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements*.txt
      - name: Cache embedding model
        uses: actions/cache@v6
        with:
          path: .fastembed
          key: fastembed-bge-small-en-v1.5
      - run: pip install -r requirements-dev.txt
      - name: Lint
        run: ruff check .
      - name: Create test database
        run: psql -h localhost -U triage -d triage -f scripts/init_test_db.sql
      - name: Tests (no API key, no AWS account)
        run: python -m pytest -q
      - name: Seed incidents
        run: python -m scripts.seed --reset
      - name: Retrieval eval gate (hit@3 must stay within 5 points of the 0.979 baseline)
        run: python -m scripts.eval_retrieval --mode hybrid --min-hit3 0.93

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24.22.2"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - name: Build API image
        run: docker build -t triage-api .
      - name: Build web image
        run: docker build -t triage-web frontend
